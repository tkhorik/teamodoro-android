name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.1.0-beta'
        required: true

# Needed to create the GitHub Release and upload the APK to it.
permissions:
  contents: write

jobs:
  release:
    name: Build signed APK & publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tag push -> strip the leading "v". Manual run -> use the typed input.
      # versionCode uses the run number so it always increases, which Android
      # requires for upgrades to be accepted.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (versionCode ${{ github.run_number }})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add the signing secrets before releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      # Guards against silently shipping a debug-signed or unsigned APK.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK not found - build produced an unsigned APK"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Rename APK
        id: apk
        run: |
          NAME="teamodoro-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.name) || github.ref_name }}
          name: Teamodoro ${{ steps.version.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
